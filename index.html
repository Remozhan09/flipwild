а.","Рывок — резким взмахом пальца, заряд виден прямо в стике.","Этажи стали запутаннее: развилки и кольца.","Поправили костюмы и мелкие недочёты."]},{n:2,d:"15 ноября",t:"Живое Закулисье",ic:"🎭",items:["Управление одним пальцем — кнопки больше не закрывают экран. Выбери удобный палец.","Вещи в Закулисье ожили — подходи и пробуй.","В Закулисье появились занятия на каждый день.","Новые испытания для самых опытных.","Окно «Что нового» и журнал обновлений в настройках."]},{n:3,d:"15 ноября",t:"Быстрый старт",ic:"⚡",items:["Игра запускается в несколько раз быстрее, заставка больше не тормозит.","Обновления скачиваются быстрее — только то, что изменилось.","Игра сама обновляется до свежей версии."]},{n:4,d:"15 ноября",t:"Рывок без случайностей",ic:"⚡",items:["Рывок теперь срабатывает только от резкого броска пальца за край стика — обычное руление его больше не тратит.","Если рывок ещё заряжается, стик подскажет.","Силу взмаха можно настроить: Настройки → «Рывок взмахом пальца»."]},{n:5,d:"15 ноября",t:"Честный эфир",ic:"🎬",items:["Начало игры стало короче: в эфир — с первых секунд.","Опасные атаки теперь заранее видны на полу и в воздухе.","Первый босс стал честнее: у него есть передышки. Перед ним можно привести себя в порядок.","Дядюшка Эфир и Рифф теперь помнят твои неудачи.","Кинескоп сам подбирается под твой телефон.","Вторая хозяйка эфира стала честнее — и щедрее.","Дерево памяти теперь растёт не только от побед.","Вершины классов стали чуть дороже.","Новые предметы — с любовью к монтажу."]},{n:6,d:"16 ноября",t:"Пульт",ic:"📺",items:["У Риффа появился пульт. Загляни в Закулисье — Дядюшка Эфир всё расскажет.","Над некоторыми дверями теперь висят значки. Что за ними — узнаешь сам.","Новые каналы открываются по мере игры.","Восемь новых предметов. Каждый водится только в своём месте.","Два новых достижения.","Таланты классов подорожали: кадров в забегах стало больше."]},{n:7,d:"17 ноября",t:"Полуночная настройка",ic:"🌙",items:["У одного из каналов появилась своя музыка.","Музыка больше не обрывается между комнатами.","Камера стала дальше — видно больше арены.","Пули врагов теперь хорошо видно на любом полу.","Дядюшка Эфир говорит медленнее — успеешь дочитать.","Портал после босса открывается не сразу — не потеряешь награду.","Рифф взрослеет медленнее, вместе с твоим опытом.","Классы при Пробуждении можно примерить.","Пули ранят, только если попали в метку на груди Риффа — её видно, когда пули рядом.","Рифф и его костюмы одного размера со всех сторон."]},{n:8,d:"17 ноября",t:"Большая ветка",ic:"🌳",items:["Рифф растёт в уровнях: каждый уровень — очко таланта.","Ветка талантов стала намного больше: три пути, ярусы и выборы. Качаться можно очень долго.","Ветку можно сбросить бесплатно и попробовать другую сборку.","Пульт режиссёра теперь называется Стол режиссёра.","Плёнку за старые таланты вернули.","Окна больше не мигают.","Новая иконка игры."]}],NEWS_LAST=NEWS[NEWS.length-1].n;function newsPending(){return meta.newsSeen===void 0&&(meta.newsSeen=(meta.runs||0)>0||meta.tutDone?0:NEWS_LAST,saveMeta()),NEWS.filter(t=>t.n>meta.newsSeen)}function newsHtml(t){return t.slice().reverse().map(e=>`<div class="nw"><h3>${e.ic} ${e.t}<small>${e.d}</small></h3><ul>${e.items.map(a=>`<li>${a}</li>`).join("")}</ul></div>`).join("")}function openNews(t,e,a){const n=mode;mode="menu",resetInput(),clearUI();const s=el(`<div class="ov tvp news"><h2>${a?"📜 Журнал обновлений":"📺 Что нового в эфире"}</h2>${a?"":'<div class="sub">Пока тебя не было, мы кое-что починили и добавили:</div>'}<div class="nbody">${newsHtml(t)}</div><button class="btn" id="nok">${a?"Назад":"Класс, в эфир!"}</button></div>`);s.querySelector("#nok").onclick=()=>{SFX.pick(),a||(meta.newsSeen=NEWS_LAST,saveMeta()),clearUI(),e?e():mode=n==="menu"?"play":n},ui.appendChild(s)}(()=>{const t=document.createElement("style");t.textContent=".ov.news .nbody{width:100%;text-align:left;overflow-y:auto;max-height:62vh}.ov.news .nw{background:rgba(243,231,201,.07);padding:calc(var(--s)*8px) calc(v 2),ctx.fillStyle="#e0303a",ctx.fill(),ctx.restore()}const _drawNightHD=drawNight;drawNight=function(){const t=_drawNightHD.apply(this,arguments);try{drawHitDot()}catch{}return t};const DTH_BIG={boss:{f:["Тортолов! Король бисквита, и характер под стать — чёрствый. Ничего, малыш, все через него проходили.","Первая встреча с Тортоловым — и сразу в тесто носом. Классика жанра!"],a:["Опять Тортолов? Смотри на красную полосу: раз полоса — значит, сейчас рванёт по прямой.","Тортолов любит отдышаться после каждой серии. Это «уф» — твоё окно, малыш!"],m:["Тортолов уже считает тебя постоянным гостем. Давай испортим ему праздник!","Я записал все твои дубли с Тортоловым. Ещё один — и выйдет целый сериал!","Тортолов зевает, когда тебя видит. Пора его разбудить как следует!","Знаешь, почему Тортолов в короне? Потому что ты пока не отобрал её. Пока!","Он топчется перед прыжком — видишь круг на полу? Это его визитная карточка.","Кольцо пуль идёт после жёлтого свечения. Свечение — значит, ищи щель.","После каждой серии он говорит «уф». Каждое «уф» — твои три выстрела.","Тортолов не бессмертный. Он просто много ест. Сбей ему аппетит!"],r:"В следующий раз я съем его вместе со свечками."},cotton:{f:["Мадам Сахарная Вата обняла тебя слишком крепко. Пух — он такой: мягкий, но коварный.","Королева пуха прячется в облаках. Ищи её по тени, малыш!"],a:["Снова Вата! Она тает, когда долго остаётся на виду. Не давай ей прятаться.","Облака у Мадам — для отвода глаз. Бей туда, где сладко пахнет!"],m:["Мадам уже шьёт тебе пуховое одеяло. Пора отказаться от подарка!","Столько встреч с Ватой… Ещё чуть-чуть — и вы будете на «ты»."],r:"Я сдую её облака, как свечки на торте."},baron:{f:["Барон Какао! Шоколадная трость, пафос и третий этаж. Ты забрался высоко!","Барон не любит гостей на своей фабрике. Но ты почти дошёл до цеха, малыш!"],a:["Барон опять? Его трость бьёт широко — держись сбоку.","Барон Какао тянет время пафосными речами. Ты тяни время рывками!"],m:["Барон уже вешает твой портрет в галерее побеждённых. Сорвём его?","Шоколад — штука горькая. Как и этот счёт с Бароном. Пора менять!"],r:"Я растоплю его трость."},giant:{f:["Желейный великан! Большой, медленный — и делится, когда злится. Ты это заметил, да?","Великан из мармелада — вкусный, но тяжёлый. Не стой под его прыжком!"],a:["Опять великан. Добей мелких желешек, пока они не облепили тебя.","Тень под великаном растёт перед приземлением. Как увидишь — в сторону!"],m:["Великан уже узнаёт тебя по походке. Это не к добру — для него!","Мы с великаном одного роста — по количеству твоих падений."],r:"Великан, а прыгает как мячик."},guard:{f:["Зефирный страж с копьём — серьёзный парень. Он таранит по прямой, малыш.","Страж охраняет второй этаж, как свою зефирку. Ты подошёл слишком близко."],a:["Снова страж! Его подмога приходит волнами — бей стража, пока они не пришли.","Копьё стража бьёт далеко, но только вперёд. Обходи сбоку!"],m:["Страж, наверное, уже ставит на тебя ставки. Давай он проиграет!","Зефирный страж — мягкий снаружи и упрямый внутри. Как и ты!"],r:"Зефир — мой любимый. Особенно побеждённый."},mixer:{f:["Миксер-громила! Взбивает всё вокруг — и тебя чуть не взбил в крем.","Венчики Миксера крутятся быстро, но он сам неповоротлив. Запомни это."],a:["Опять Миксер? Когда он раскручивается, отойди подальше и стреляй.","Миксер устаёт после каждого вихря. Не пропусти момент!"],m:["Ещё пара встреч — и Миксер научится делать тебе коктейль. Не дадим ему!","Миксер уже знает твой любимый вкус. Пора его удивить."],r:"Я его выключу из розетки."},tank:{f:["Паровой танк! Медленный, но упрямый — как мой дедушка-радиоприёмник.","Танк из Стимпанка не сворачивает. Значит, сворачивать придётся тебе."],a:["Снова танк! Обходи его — сзади у него котёл.","Танк стреляет только туда, куда смотрит. Будь сбоку, малыш."],m:["Танк уже нарисовал твою звёздочку у себя на броне. Давай сотрём!","С танком у вас долгая переписка. Пора поставить точку."],r:"Танки боятся щекотки. Проверю."},octo:{f:["Медный осьминог! Щупальца из-под пола — смотри на трещины, малыш.","Восемь щупалец против одного волчонка — нечестно. Но ты же справишься?"],a:["Опять осьминог? Щупальце вылезает там, где пол дрожит.","Осьминог прячется, но голова у него одна. Бей по голове!"],m:["Осьминог уже машет тебе всеми восемью. Привычка, однако!","Скоро у осьминога кончатся щупальца, а у тебя — терпения. Кто первый?"],r:"Я завяжу его щупальца бантиком."},captain:{f:["Капитан Шестерня! Хозяин Медной гавани не пускает чужих на борт.","Капитан командует пушками, а не ногами. Двигайся — и он промахнётся."],a:["Снова Капитан. Его залпы идут по порядку — найди ритм.","Капитан кричит перед каждым залпом. Слушай его, малыш!"],m:["Капитан уже записал тебя в судовой журнал. Красными чернилами!","Сколько можно тонуть в Медной гавани? Пора всплыть победителем!"],r:"Капитан, пора на берег."},smith:{f:["Кузнец Котёл раскалил мастерские. Горячо, малыш? Это только начало!","Кузнец бьёт молотом по полу — от удара идёт жар. Не стой рядом!"],a:["Опять Кузнец? После удара молота он застывает. Вот тут и бей!","Котёл перегревается. Подожди, пока он остынет, — и в атаку."],m:["Кузнец уже выковал табличку с твоим именем. Переплавим её?","Вы с Кузнецом так часто видитесь, что он мог бы сделать тебе меч."],r:"Я остужу его пыл."},clockking:{f:["Король Часов! Время работает на него — но и у королей бывают сбои.","Король замедляет время вокруг. Не паникуй — двигайся ровно."],a:["Снова Король Часов? Его стрелки ходят по кругу. Встань между ними!","Король бьёт каждые «тик-так». Считай вместе с ним."],m:["Король Часов уже ведёт обратный отсчёт твоих попыток. Обнулим его!","Время — вещь упрямая. Как и ты. Посмотрим, кто кого."],r:"Я сломаю его будильник."},piano:{f:["Пианино-мимик! Не всё, что блестит, — сундук. Я тоже купился в первый раз.","Клавиши у мимика острые. Не подходи, пока он не «сыграл»."],a:["Опять пианино? Оно играет гаммы — пули идут волной.","Мимик выдаёт себя скрипом. Слушай внимательно!"],m:["Пианино уже выучило тебя наизусть. Пора сыграть ему новую мелодию!","Сколько можно попадаться на сундук-обманку? Ну ладно, все попадаются."],r:"Больше никаких подозрительных сундуков."},harry:{f:["Громкоговоритель Гарри! Самый громкий на районе — у меня до сих пор звенит.","Гарри оглушает волнами звука. Держись от его раструба подальше!"],a:["Снова Гарри! Его крик идёт конусом — стань сбоку.","Гарри выдыхается после каждого крика. Подойди в этот момент!"],m:["Гарри уже поёт тебе серенады. Пора сделать ему потише.","У Гарри громкий голос, а у тебя — громкий счёт попыток. Сравняем?"],r:"Я выкручу ему громкость."},boomb:{f:["Бум-Бом! Барабанщик-великан бьёт так, что пол прыгает.","Волны от барабана идут в такт. Прыгай между ударами, малыш!"],a:["Опять Бум-Бом? Считай: раз-два-три — и прыжок!","Бум-Бом теряет ритм, когда злится. Тут-то и лови его."],m:["Бум-Бом уже отбивает марш в твою честь. Траурный. Поменяем мелодию!","Сколько можно плясать под его барабан? Задай свой ритм!"],r:"Я порву его барабан."},diva:{f:["Дива Фальцет! Звезда оркестровой ямы взяла верхнее «до» — и ты не выдержал.","Голос у Дивы режет пули пополам. Не стой на её высоких нотах!"],a:["Снова Дива? Перед высокой нотой она набирает воздух — уходи!","Дива любит аплодисменты. Аплодируй ей… рывками!"],m:["Дива уже бросает тебе розы. Не те, малыш, не те.","Ты слышал её арию столько раз — скоро будешь подпевать."],r:"Её песенка спета."},maestro:{f:["Маэстро Какофон! Дирижёр Помехи. Ты дошёл до финала Свинг-Сити, малыш!","Маэстро дирижирует пулями. Смотри на палочку — она показывает, куда полетят!"],a:["Опять Маэстро? Его оркестр играет по нотам. Выучи партитуру!","Какофон сбивается, когда его музыкантов меньше. Бей оркестр!"],m:["Маэстро уже пишет симфонию о твоих падениях. Сорвём премьеру!","Какофон и ты — старые знакомые. Время для последнего аккорда."],r:"Его оркестр ещё сыграет мне туш."},organ:{f:["Орган-призрак! Аккорды кольцами — красиво, но больно.","Орган зовёт призраков на подмогу. Убери их до следующего аккорда!"],a:["Снова Орган? Между кольцами есть щели — ищи их.","Орган играет медленно в начале. Используй это!"],m:["Орган уже играет твою песенку. Пора сменить пластинку.","Привидения на подпевке уже выучили твоё имя."],r:"Я закрою ему крышку."},scarecrow:{f:["Пугало! Соломенный вихрь и полчища мышей. Жуть, а не огород.","Пугало крутится, но потом его ведёт. Тут и бей!"],a:["Опять Пугало? Сначала мыши — потом солома.","Пугало боится огня. А ещё — твоего упорства."],m:["Пугало, кажется, перестало тебя пугать. Значит, пора его победить!","Ты так часто бываешь на этом огороде, что пора сажать морковку."],r:"Пугало боится меня. Просто ещё не знает."},bonecond:{f:["Костяной дирижёр! Гасит свет — и ведёт пули в темноте.","В темноте следи за глазами врагов. Они светятся!"],a:["Снова Дирижёр? Перед тем как погасить свет, он поднимает палочку.","Его костяшки стучат в ритм. Слушай!"],m:["Дирижёр уже кланяется тебе со сцены. Пора сорвать овации!","В темноте вы с ним так часто встречались… Включим свет!"],r:"Я станцую на его костях. В переносном смысле."},witch:{f:["Ведьма-котёл! Лужи от зелий тянут лапы. Не наступай в зелёное!","Ведьма варит зелья медленно. Бей, пока котёл пуст!"],a:["Опять Ведьма? Зелья летят по дуге — смотри на тени.","Ведьма злится, когда котёл пустеет. Опустоши его!"],m:["Ведьма уже записала тебя в свою книгу рецептов. Вычеркнем!","Котёл кипит, а у тебя — опыт. Ещё одна попытка!"],r:"Я опрокину её котёл."},pumpking:{f:["Тыквенный король! Владыка Полуночного канала. Ты дошёл до самой полуночи, малыш!","Король тыкв горит изнутри. Подожди, пока пламя спадёт."],a:["Снова Тыквенный король? Его свита — тыквы-фонари. Разбей их, и станет темно — ему тоже.","Король ходит медленно, но бьёт широко. Держи дистанцию!"],m:["Тыквенный король уже вырезает твою улыбку на новой тыкве. Хватит!","Полночь бьёт для тебя снова и снова. Пусть пробьёт и для него!"],r:"Из него выйдет отличный пирог."},pomeha:{f:["Помеха… Сама. Ты добрался до неё, Рифф. Это уже победа — почти.","Помеха крадёт Кадры Реальности. Ты видел её силу. Теперь ты знаешь, к чему готовиться."],a:["Снова Помеха. Её атаки — это помехи эфира. Ищи чистый сигнал между ними!","Помеха слабеет, когда ты не даёшь ей передышки."],m:["Сколько раз ты стоял перед Помехой, Рифф… Я горжусь тобой. Ещё раз.","Помеха боится одного — что ты не сдашься. И ты не сдаёшься."],r:"Это ещё не финал."}},DTH_EN={zhele:["Желешка! Маленькая, а прыгает прямо в лоб. Бей, пока она в воздухе.","Опять желешка? Не стой — она прыгает туда, где ты стоишь сейчас."],cube:["Желейный куб целится и бросается. Шаг в сторону — и он пролетит мимо!","Снова куб! Видишь красную полосу — уходи с неё."],maw:["Мятная пасть растёт из пола. Не подходи к ней близко, малыш!","Пасть кусает только рядом. Стреляй издалека!"],cupcake:["Кекс-бомбист! Смотри на тень под бомбой — там будет бум.","Опять кексы? Красный круг на полу — оттуда бегом!"],gear:["Часовая шестерня крутится и режет. Видишь свечение — сейчас кольцо!","Снова шестерня. Между зубьями кольца всегда есть щель."],shield:["Печенечный рыцарь прячется за щитом. Рывок сквозь него — и щит выбит!","Опять рыцарь? Щит только спереди. Зайди сзади или пролети насквозь."],worm:["Мармеладный червь ныряет под пол. Бей, когда он снаружи!","Снова червь! Где пол дрожит — там он вынырнет."],fairy:["Ватная фея лечит друзей. Бей фею первой — потом остальных!","Опять фея? Без неё комната сдуется вдвое быстрее."],fuse:["Фитиль-конфета мигает перед взрывом. Мигает — беги!","Снова фитиль! Пусть взорвётся рядом с врагами, а не с тобой."],slug:["Шоколадная улитка медленная, но липкая. Не наступай в шоколад!","Опять улитка? Её след тормозит. Обходи."],sniper:["Леденцовый снайпер! Красная линия выдаёт, куда полетит выстрел.","Снова снайпер. Видишь линию — шаг в сторону."],mouse:["Заводная мышь носится, пока не кончится завод. Подожди, пока выдохнется!","Опять мышь? Она бегает по прямой — обходи."],kettle:["Чайник-ворчун кипит от злости. Пар — горячий, малыш!","Снова чайник? Он свистит перед паром."],pipe:["Паровая труба плюётся паром во все стороны. Найди просвет!","Опять труба. Она не двигается — обходи по краю."],diver:["Водолаз-механик тяжёлый и бронированный. Бей в спину!","Снова водолаз? Его ключ бьёт широко. Держи дистанцию."],gull:["Чайка-аэроплан пикирует с неба. Следи за тенью!","Опять чайка? Тень растёт — значит, сейчас упадёт."],alarm:["Будильник-паникёр будит всю комнату. Глуши его первым!","Снова будильник! Пока он звенит, враги злее."],note:["Нотка скачет в ритме. Поймай ритм — и она твоя.","Опять нотки? Они прыгают в такт музыке."],vinyl:["Пластинка рикошетит от стен. Стой в центре!","Снова пластинка? Посчитай отскоки — и уходи."],drum:["Барабан бьёт по полу — волны идут в такт.","Опять барабан. Прыгай между волнами!"],sax:["Саксофон дует нотами веером. Встань между нотами!","Снова саксофон? Он набирает воздух перед залпом."],metro:["Метроном задаёт ритм всей комнате. Сломай его — и все собьются!","Опять метроном. Пока он тикает, враги быстрее."],gloves:["Перчатки-хлопушки хлопают так, что звенит в ушах. Не стой между ними!","Снова перчатки? Хлопок — в центре. Уходи в сторону."],bass:["Контрабас огромный и гулкий. Его волна идёт низко!","Опять контрабас? Обходи его, он неповоротлив."],mic:["Микрофон глушит выстрелы криком. Подойди ближе!","Снова микрофон. Пока он кричит — твои пули тише."],skel:["Скелет-чечёточник кидает кость-бумеранг. Она возвращается!","Опять скелет? Кость летит туда и обратно. Подожди возврата."],ghost:["Привидение-простыня неуязвимо, пока прозрачное. Жди, пока проявится!","Снова привидение? Бей, когда оно видно."],bat:["Летучая мышь сжимается перед броском. Сжалась — отскочи!","Опять мыши? Кружат, кружат — и бросок."],pumpkin:["Тыква-фонарь светится сама. Разбей — будет лужица света!","Снова тыква? Свет от неё помогает видеть остальных."],candle:["Свеча-призрак плюётся огоньками издалека.","Опять свеча? Она держится поодаль — сокращай дистанцию."],coffin:["Гроб-мимик притворяется мебелью! Не всё, что стоит, — стоит спокойно.","Снова гроб? Подходи осторожно."],frog:["Болотная жаба целится языком. Розовая линия — уйди с неё!","Опять жаба? Язык бьёт по прямой."],spider:["Паук на нитке падает сверху. Следи за тенью!","Снова паук? Тень на полу — уходи."]},DTH_MILE={1:"Первое падение, малыш! В нашем деле это посвящение. Добро пожаловать в эфир!",3:"Третье падение. Знаешь, сколько дублей снимали в 30-х? Сотни! Ты только разогреваешься.",5:"Пятое падение. Ты замечаешь, как с каждым разом заходишь дальше? Я — да.",10:"Десять падений! Юбилей. Я бы вручил тебе кубок, но полка пока для побед.",20:"Двадцать падений… Знаешь, что общего у тебя и у телевизора? Вы оба не выключаетесь!",30:"Тридцать раз ты падал и тридцать раз вставал. Вот это и есть шоу, Рифф.",50:"Пятидесятое падение. Полсотни дублей! Режиссёр бы прослезился. Я — прослезился.",75:"Семьдесят пять падений. Ты упрямее любой Помехи. Это я тебе как эфир говорю.",100:"Сотое падение! Сотня, Рифф! Кто-нибудь, дайте этому волчонку медаль за упорство!",150:"Сто пятьдесят. Я перестал считать. Шучу — я считаю каждое. И горжусь каждым подъёмом."},DTH_FLOOR={1:["Первый этаж — самый коварный: кажется, что всё просто. Ещё раз, спокойно.","Первый этаж — это разминка. Разомнёмся ещё разок!","Не беда, что на первом. Каждый дубль учит чему-то новому."],2:["Второй этаж! Ты уже прошёл одного босса — не забывай об этом.","На втором этаже враги злее. Но и ты сильнее.","Второй этаж — середина пути. Половина дела сделана, малыш."],3:["Третий этаж! До Помехи было рукой подать.","Так близко к финалу… Следующий дубль будет тем самым, я чувствую.","Третий этаж — это уже высший класс. Ещё чуть-чуть!"]},DTH_RUN={quick:["Быстро ты нас покинул! Вдохни поглубже — и снова в эфир.","Это был самый короткий выпуск в истории канала! Ну, почти.","Эфир длился меньше рекламной паузы. Давай-ка ещё раз, спокойнее.","Фальстарт! Бывает. Вторая попытка — самая точная."],long:["Вот это был эфир! Длинный, честный, с поворотами. Зрители в восторге.","Целый полнометражный фильм! Жаль, концовка не та. Переснимем.","Ты продержался так долго, что я успел заварить чай. Дважды.","Длинный забег — это уже мастерство. Финал будет твоим."],rich:["С таким набором вещей — и упасть? Помеха, видать, очень испугалась.","Ты был так нагружен предметами, что тебя просто перевесило. Шучу!","Отличная сборка была! Запомни, что работало."]},DTH_ETHER=["Ничего, малыш. Даже лучшие шоу снимают с нескольких дублей.","Падать — не стыдно. Стыдно не вставать. А ты встаёшь!","Каждое падение — это репетиция победы.","Помеха думает, что победила. Она ошибается.","Перерыв на рекламу окончен! Снова в эфир!","Ещё один дубль — и мы его снимем, Рифф.","Ты стал быстрее. Я вижу это по записям.","Отдохни минутку в Закулисье. Потом — снова туда.","Знаешь, что говорили в 30-х? «Шоу должно продолжаться!»","Ты держался молодцом. Правда.","В следующий раз попробуй другое оружие — вдруг оно твоё?","Даже мультики раньше рисовали по кадрику. Шаг за шагом, Рифф."],DTH_RIFF=[["Ай! Это было больно… Но я не сдамся!","Ну и ладно! Сейчас я им покажу!","Я почти успел! Ещё разок!","Ой-ой… Где мой хвост? А, вот он.","Я же говорил, что это была разминка!","Хм. Надо было прыгнуть левее.","Это нечестно! Но я всё равно попробую снова.","В следующий раз я буду быстрее!"],["Понял. Ошибся с рывком.","Ещё раз. Теперь я знаю, что делать.","Не страшно. Я учусь.","Помеха получит своё.","Надо следить за полосами.","Хорошо. Ещё попытка.","В этот раз почти.","Я помню, где ошибся."],["Ещё раз.","Учту.","Это ничего не меняет.","Помеха не уйдёт.","Следующий дубль — мой.","Я вернусь.","Отдых — и снова.","Хватит падать."]];function dthKiller(){let t=null,e=1e9;for(const a of enemies){if(a.dead)continue;const n=Math.hypot(a.x-P.x,a.y-P.y)-(isBig(a)?350:0);n<e&&(e=n,t=a)}return t?t.type:null}const _dieDth=die;die=function(){try{if(mode!=="dead"&&run&&!run.tut&&!run.hub){const t=dthKiller(),e=meta.dth=meta.dth||{n:0,by:{},said:[]};e.n++,t&&(e.by[t]=(e.by[t]||0)+1),meta.lastDeath={k:t,cnt:t?e.by[t]:0,fl:run.floorN||1,t:Math.round(run.playT||0),items:
